<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Admin ตรวจสลิป — เที่ยวนี่เหอะ</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #060b13;
  --bg2: #0c1524;
  --bg3: #111d2e;
  --blue: #38bdf8;
  --blue2: #0284c7;
  --green: #10b981;
  --red: #ef4444;
  --yellow: #f59e0b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --muted: #64748b;
  --border: rgba(255, 255, 255, .08);
}

body {
  font-family: 'IBM Plex Sans Thai', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

button, input, select { font-family: inherit; }

/* ============================================================
   LOGIN
   ============================================================ */
#loginPage {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, .16), transparent 60%), var(--bg);
}

.login-box {
  width: 100%;
  max-width: 380px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 28px 22px;
  text-align: center;
  box-shadow: 0 22px 60px rgba(0, 0, 0, .5);
}

.login-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  box-shadow: 0 0 24px rgba(56, 189, 248, .35);
  border: 2px solid var(--blue);
}
.login-icon img { width: 100%; height: 100%; object-fit: cover; }

.login-box h1 { font-size: 22px; font-weight: 800; }
.login-box p { margin-top: 6px; color: var(--sub); font-size: 13px; }

.login-input {
  width: 100%;
  height: 50px;
  margin-top: 22px;
  padding: 0 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: #fff;
  outline: none;
  font-size: 15px;
}
.login-input:focus { border-color: var(--blue); }

.login-btn {
  width: 100%;
  height: 50px;
  border: 0;
  border-radius: 14px;
  margin-top: 12px;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(2, 132, 199, .35);
}
.login-btn:disabled { opacity: .6; cursor: wait; }

.login-note {
  margin-top: 16px;
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* ============================================================
   APP SHELL / HEADER
   ============================================================ */
#adminApp { display: none; }

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 16px 16px 18px;
  background: linear-gradient(160deg, rgba(2, 132, 199, .22), rgba(6, 11, 19, .96) 65%), var(--bg2);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
}

.header-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.header-title { display: flex; align-items: center; gap: 12px; }
.header-ico {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 16px rgba(56, 189, 248, .35);
  flex-shrink: 0;
}
.header h1 { font-size: 17px; font-weight: 800; color: #fff; }
.header p { font-size: 10.5px; color: var(--sub); margin-top: 2px; }

.header-actions { display: flex; gap: 8px; flex-shrink: 0; }
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid rgba(56, 189, 248, .25);
  background: rgba(56, 189, 248, .1);
  color: var(--blue);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:active { transform: scale(.94); }

.main { max-width: 820px; margin: 0 auto; padding: 16px 16px 90px; }

/* ============================================================
   STATS
   ============================================================ */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }

.stat {
  background: linear-gradient(160deg, var(--bg2), var(--bg3));
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px 8px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.stat::after {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 70px; height: 70px;
  border-radius: 50%;
  background: rgba(56, 189, 248, .08);
}
.stat strong { display: block; font-size: 24px; font-weight: 800; color: #fff; }
.stat span { font-size: 10.5px; color: var(--sub); font-weight: 600; }
.stat.pending strong { color: var(--yellow); }
.stat.approved strong { color: var(--green); }

/* ============================================================
   FILTERS
   ============================================================ */
.filters {
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.search-wrap { position: relative; }
.search-wrap .s-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--muted); }
.search-input {
  width: 100%;
  height: 46px;
  padding: 0 14px 0 40px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: #fff;
  outline: none;
  font-size: 14px;
}
.search-input:focus { border-color: var(--blue); }

.status-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.status-chips::-webkit-scrollbar { display: none; }
.chip-btn {
  flex-shrink: 0;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--sub);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.chip-btn.active {
  border-color: var(--blue);
  background: rgba(56, 189, 248, .14);
  color: var(--blue);
}

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 22px;
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .3);
}

.card-photo { position: relative; width: 100%; aspect-ratio: 16 / 8; overflow: hidden; background: var(--bg3); }
.card-photo img { width: 100%; height: 100%; object-fit: cover; }
.card-photo::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(6, 11, 19, 0) 45%, rgba(6, 11, 19, .92) 100%);
}
.card-photo-title {
  position: absolute; left: 14px; bottom: 12px; right: 90px; z-index: 2;
  font-size: 15px; font-weight: 800; color: #fff; line-height: 1.3;
}
.card-photo-sub {
  position: absolute; left: 14px; bottom: -2px; z-index: 2;
  font-size: 11px; color: var(--sub);
  display: none;
}

.status {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  flex-shrink: 0;
  font-size: 10.5px;
  font-weight: 800;
  border-radius: 999px;
  padding: 6px 11px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, .2);
  white-space: nowrap;
}
.status-pending { color: #1a1300; background: rgba(245, 158, 11, .88); }
.status-approved { color: #04150e; background: rgba(16, 185, 129, .88); }
.status-rejected { color: #fff; background: rgba(239, 68, 68, .9); }
.status-other { color: #fff; background: rgba(100, 116, 139, .85); }
.price-pill { color: #fff; background: linear-gradient(135deg, var(--blue2), var(--blue)); }

/* ============================================================
   ADMIN TAB SWITCHER
   ============================================================ */
.admin-tabs { display: flex; gap: 6px; background: var(--bg2); border: 1px solid var(--border); border-radius: 15px; padding: 4px; margin-bottom: 16px; }
.admin-tab-btn { flex: 1; height: 42px; border: 0; border-radius: 12px; background: transparent; color: var(--sub); font-size: 13px; font-weight: 700; cursor: pointer; }
.admin-tab-btn.active { background: linear-gradient(135deg, var(--blue2), var(--blue)); color: #fff; box-shadow: 0 4px 14px rgba(2, 132, 199, .35); }

/* ============================================================
   EQUIPMENT RENTAL CARDS
   ============================================================ */
.equip-items { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.equip-items span { background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .06); border-radius: 10px; padding: 6px 10px; font-size: 11.5px; color: #e2e8f0; }
.equip-total-row {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(56, 189, 248, .08);
  border: 1px solid rgba(56, 189, 248, .18);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 13px; font-weight: 800; color: #fff;
}
.equip-total-row span:last-child { color: var(--blue); font-size: 15px; }

.card-body { padding: 14px 16px 16px; }
.card-sub { font-size: 11.5px; color: var(--sub); margin-bottom: 12px; display: flex; align-items: center; gap: 5px; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.info { background: rgba(255, 255, 255, .03); border: 1px solid rgba(255, 255, 255, .04); border-radius: 12px; padding: 9px 10px; }
.info span { display: block; font-size: 9px; color: var(--muted); margin-bottom: 3px; font-weight: 600; letter-spacing: .2px; }
.info strong { display: block; color: #e2e8f0; font-size: 12.5px; word-break: break-word; }

.slip-btn {
  width: 100%;
  height: 44px;
  border: 1px solid rgba(56, 189, 248, .25);
  border-radius: 12px;
  background: rgba(56, 189, 248, .1);
  color: var(--blue);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.slip-btn.no-slip { color: var(--muted); background: rgba(148, 163, 184, .06); border-color: var(--border); cursor: not-allowed; }

.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.action-btn { height: 44px; border: 0; border-radius: 12px; color: #fff; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.action-btn:active { transform: scale(.97); }
.approve-btn { background: var(--green); }
.reject-btn { background: var(--red); }
.pending-btn { grid-column: 1 / -1; background: #334155; color: var(--sub); }

.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty .ico { font-size: 44px; margin-bottom: 12px; display: block; }
.loading { text-align: center; padding: 60px 20px; color: var(--blue); }

.logout {
  width: 100%;
  height: 46px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  margin-top: 18px;
  cursor: pointer;
}
.logout:hover { color: var(--red); border-color: rgba(239, 68, 68, .3); background: rgba(239, 68, 68, .06); }

@media (min-width: 600px) {
  .filters { flex-direction: row; }
  .search-wrap { flex: 1; }
}
</style>
</head>

<body>

<!-- ============================================================
     LOGIN
     ============================================================ -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-icon"><img src="เที่ย นี่เหอะ.png" onerror="this.src='https://via.placeholder.com/90?text=🏕'" alt="โลโก้"></div>
    <h1>Admin เที่ยวนี่เหอะ</h1>
    <p>ตรวจสอบสลิปและสถานะการชำระเงิน</p>

    <input id="adminToken" class="login-input" type="password" placeholder="กรอกรหัส Admin" onkeydown="if(event.key==='Enter') adminLogin()">

    <button id="loginBtn" class="login-btn" onclick="adminLogin()">เข้าสู่ระบบ Admin →</button>

    <p class="login-note">🔒 เบราว์เซอร์นี้จะจดจำการเข้าสู่ระบบให้อัตโนมัติ</p>
  </div>
</div>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div id="adminApp">
  <header class="header">
    <div class="header-inner">
      <div class="header-title">
        <div class="header-ico">📥</div>
        <div>
          <h1>หลังบ้านเที่ยวนี่เหอะ</h1>
          <p>ตรวจสลิป & เช่าอุปกรณ์</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" onclick="refreshCurrentTab()" title="อัปเดต">🔄</button>
        <button class="icon-btn" onclick="adminLogout()" title="ออกจากระบบ">🚪</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="admin-tabs" id="adminTabs">
      <button class="admin-tab-btn active" data-tab="bookings" onclick="switchAdminTab('bookings')">🧾 ตรวจสลิป</button>
      <button class="admin-tab-btn" data-tab="equip" onclick="switchAdminTab('equip')">🎒 เช่าอุปกรณ์</button>
    </div>

    <div class="stats">
      <div class="stat" id="statBox1"><strong id="statVal1">0</strong><span id="statLabel1">ทั้งหมด</span></div>
      <div class="stat" id="statBox2"><strong id="statVal2">0</strong><span id="statLabel2">รอตรวจ</span></div>
      <div class="stat" id="statBox3"><strong id="statVal3">0</strong><span id="statLabel3">ชำระแล้ว</span></div>
    </div>

    <div class="filters">
      <div class="search-wrap">
        <span class="s-ico">🔍</span>
        <input id="searchInput" class="search-input" placeholder="ค้นหาชื่อ เบอร์ ทริป หรือที่นั่ง" oninput="onSearchInput()">
      </div>

      <div class="status-chips" id="statusChips">
        <button class="chip-btn active" data-status="" onclick="setStatusFilter('')">ทุกสถานะ</button>
        <button class="chip-btn" data-status="รอตรวจสอบสลิป" onclick="setStatusFilter('รอตรวจสอบสลิป')">รอตรวจสอบ</button>
        <button class="chip-btn" data-status="ชำระเงินแล้ว" onclick="setStatusFilter('ชำระเงินแล้ว')">ชำระเงินแล้ว</button>
        <button class="chip-btn" data-status="สลิปไม่ถูกต้อง" onclick="setStatusFilter('สลิปไม่ถูกต้อง')">สลิปไม่ถูกต้อง</button>
        <button class="chip-btn" data-status="รอชำระเงิน" onclick="setStatusFilter('รอชำระเงิน')">รอชำระเงิน</button>
      </div>
    </div>

    <div id="bookingList" class="loading">กรุณาเข้าสู่ระบบ</div>
  </main>
</div>

<iframe id="adminPostFrame" name="adminPostFrame" style="display:none"></iframe>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbyFa3pB1dRaHu3ibu4l7DmrGWianorR7FVrWsQyF8qFtJn7UTBE7mSUHAcVq0_UxELM/exec";

const TOKEN_STORAGE_KEY = 'tnh_admin_token';

// รูปภาพแต่ละทริป — คีย์ต้องตรงกับชื่อทริปในหน้าจองเป๊ะๆ (ใช้ชุดเดียวกับหน้าเว็บหลัก)
const TRIP_IMAGES = {
  "แม่ละเมา อุ้มเปี้ยม 30-1 มิ.ย.69": "แม่ละเมา.jpg",
  "โบลาเวน 6-8 มิ.ย.69": "โบลาเวน.jpg",
  "ดอยผาเวียง 13-14 มิ.ย.69": "ดอยผาเวียง.jpg",
  "ดอยห้วยทู่ 4-5 ก.ค.69": "ดอยห้วยทู่.jpg",
  "ดอยทูเลจอวาเล 30-1 พ.ย.69": "ดอยทูเลจอวาเล.jpg",
  "เปรโต๊ะ 19-21 มิ.ย.69": "เปรโต๊ะ.jpg",
  "ดอยหลวงตาก 27-28 มิ.ย.69": "ดอยหลวงตาก.jpg",
  "เปรโต๊ะ 17-19 ก.ค.69": "เปรโต๊ะ.jpg",
  "น้ำตกสายรุ้งละอองดาว 25-26 ก.ค.69": "สายรุ้งละอองดาว.jpg",
  "น้ำตกห้วยน้ำเย็น 8-9 ส.ค.69": "ห้วยน้ำเย็น.jpg",
  "เขาหลัก 14-16 ส.ค.69": "เขาหลัก.jpg",
  "ภูสอยดาว 22-23 ส.ค.69": "ภูสอยดาว.jpg",
  "ป่าบงเปียง 29-30 ส.ค.69": "ป่าบงเปียง.jpg",
  "ป่าบงเปียง(ตู้4) 29-30 ส.ค.69": "ป่าบงเปียง.jpg",
  "หว่าวาโจ 18-20 ก.ย.69": "หว่าวาโจ.jpg",
  "หว่าวาโจ V.2 6-8 พ.ย.69": "หว่าวาโจ.jpg",
  "ภูเขาควาย 8-11 ต.ค.69": "ภูเขาควาย.jpg",
  "เลอกวาเดาะ 17-18 ต.ค.69": "เลอกวาเดาะ.jpg",
  "เส่ซูโจ๊ะ-ดอยหมากพริก 23-25 ต.ค.69": "ดอยหมากพริก.jpg",
  "ลังกาหลวง-ลังกาน้อย 5-7 ธ.ค.69": "ดอยลังกาหลวง.jpg",
  "เขาหลวงสุโขทัย 12-13 ก.ย.69": "เขาหลวงสุโขทัย.jpg",
  "พือหน่อยเล 26-27 ก.ย.69": "พือหน่อยเล.jpg",
  "นุรึโจ-ตะโกหล่อโจ 5-7 ก.ย.69": "นุรึโจ.jpg"
};

function getTripImage(tripName) {
  return TRIP_IMAGES[tripName] || 'default.jpg';
}

let adminToken = "";
let allBookings = [];
let allEquipRentals = [];
let allPickupPoints = [];
let equipLoaded = false;
let currentAdminTab = "bookings"; // 'bookings' | 'equip'
let currentStatusFilter = "";


/* ============================================================
   AUTO LOGIN (จำรหัสไว้ในเครื่อง ไม่ต้องกรอกซ้ำทุกครั้ง)
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(TOKEN_STORAGE_KEY);
  if (!saved) return;

  adminToken = saved;
  document.getElementById("bookingList").innerHTML =
    '<div class="loading">⌛ กำลังเข้าสู่ระบบอัตโนมัติ...</div>';
  loadBookings(true);
});


/* ============================================================
   LOGIN
============================================================ */

function adminLogin() {
  const tokenInput =
    document.getElementById("adminToken");

  const token =
    tokenInput.value.trim();

  if (!token) {
    Swal.fire({
      icon: "warning",
      title: "กรอกรหัสก่อนครับ",
      background: "#0c1524",
      color: "#f1f5f9",
      confirmButtonColor: "#0284c7"
    });

    return;
  }

  adminToken = token;

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '⌛ กำลังตรวจสอบ...';

  document.getElementById("bookingList").innerHTML =
    '<div class="loading">⌛ กำลังตรวจสอบรหัส...</div>';

  loadBookings(true);
}


function adminLogout() {
  adminToken = "";
  allBookings = [];

  localStorage.removeItem(TOKEN_STORAGE_KEY);

  document.getElementById("adminToken").value = "";
  document.getElementById("adminApp").style.display = "none";
  document.getElementById("loginPage").style.display = "flex";

  const btn = document.getElementById('loginBtn');
  btn.disabled = false;
  btn.textContent = 'เข้าสู่ระบบ Admin →';
}


/* ============================================================
   LOAD JSONP
============================================================ */

function loadBookings(firstLogin) {
  if (!adminToken) {
    return;
  }

  const list =
    document.getElementById("bookingList");

  list.innerHTML =
    '<div class="loading">⌛ กำลังโหลดรายการจอง...</div>';

  const callbackName =
    "adminCb_" + Date.now();

  const script =
    document.createElement("script");

  let finished = false;

  window[callbackName] = function (response) {
    finished = true;

    try {
      if (!response || !response.ok) {
        throw new Error(
          response?.message ||
          "ไม่สามารถโหลดข้อมูลได้"
        );
      }

      allBookings =
        Array.isArray(response.bookings)
          ? response.bookings
          : [];

      if (firstLogin) {
        localStorage.setItem(TOKEN_STORAGE_KEY, adminToken);

        document.getElementById("loginPage").style.display =
          "none";

        document.getElementById("adminApp").style.display =
          "block";
      }

      updateBookingStats();
      renderBookings();
      loadPickupPoints();

    } catch (error) {
      if (firstLogin) {
        adminToken = "";
        localStorage.removeItem(TOKEN_STORAGE_KEY);

        const btn = document.getElementById('loginBtn');
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ Admin →';
      }

      Swal.fire({
        icon: "error",
        title: "เข้าระบบไม่สำเร็จ",
        text: error.message,
        background: "#0c1524",
        color: "#f1f5f9",
        confirmButtonColor: "#0284c7"
      });

      list.innerHTML =
        '<div class="empty"><span class="ico">📭</span>ไม่สามารถโหลดข้อมูลได้</div>';

    } finally {
      cleanupJsonp(
        callbackName,
        script
      );
    }
  };

  script.onerror = function () {
    if (finished) {
      return;
    }

    if (firstLogin) {
      const btn = document.getElementById('loginBtn');
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ Admin →';
    }

    Swal.fire({
      icon: "error",
      title: "เชื่อมต่อหลังบ้านไม่ได้",
      text: "ตรวจสอบ URL และการ Deploy Apps Script",
      background: "#0c1524",
      color: "#f1f5f9",
      confirmButtonColor: "#0284c7"
    });

    cleanupJsonp(
      callbackName,
      script
    );
  };

  script.src =
    API_URL +
    "?action=adminBookings" +
    "&adminToken=" +
    encodeURIComponent(adminToken) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();

  document.body.appendChild(script);
}


function cleanupJsonp(
  callbackName,
  script
) {
  try {
    delete window[callbackName];
  } catch (error) {
    window[callbackName] = undefined;
  }

  if (script && script.parentNode) {
    script.remove();
  }
}


/* ============================================================
   FILTER / RENDER
============================================================ */

function setStatusFilter(status) {
  currentStatusFilter = status;

  document.querySelectorAll('.chip-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === status);
  });

  renderBookings();
}

function setStatBox(n, value, label, colorClass) {
  document.getElementById('statVal' + n).textContent = value;
  document.getElementById('statLabel' + n).textContent = label;
  const box = document.getElementById('statBox' + n);
  box.classList.remove('pending', 'approved');
  if (colorClass) box.classList.add(colorClass);
}

function updateBookingStats() {
  const pending =
    allBookings.filter(
      item =>
        item.status === "รอตรวจสอบสลิป"
    ).length;

  const approved =
    allBookings.filter(
      item =>
        item.status === "ชำระเงินแล้ว"
    ).length;

  setStatBox(1, allBookings.length, 'ทั้งหมด', null);
  setStatBox(2, pending, 'รอตรวจ', 'pending');
  setStatBox(3, approved, 'ชำระแล้ว', 'approved');
}

function updateEquipStats() {
  const totalItems = allEquipRentals.reduce(
    (sum, r) => sum + Number(r.tent || 0) + Number(r.sleepingBag || 0) + Number(r.sleepingPad || 0),
    0
  );
  const totalRevenue = allEquipRentals.reduce((sum, r) => sum + Number(r.total || 0), 0);

  setStatBox(1, allEquipRentals.length, 'รายการเช่า', null);
  setStatBox(2, totalItems, 'ชิ้นอุปกรณ์', null);
  setStatBox(3, totalRevenue.toLocaleString(), 'ยอดรวม (บาท)', 'approved');
}

/* ============================================================
   TAB SWITCHER (ตรวจสลิป ⇄ เช่าอุปกรณ์)
============================================================ */

function switchAdminTab(tab) {
  currentAdminTab = tab;

  document.querySelectorAll('.admin-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

  document.getElementById('statusChips').style.display = tab === 'bookings' ? 'flex' : 'none';

  const search = document.getElementById('searchInput');
  search.value = '';
  search.placeholder = tab === 'bookings'
    ? 'ค้นหาชื่อ เบอร์ ทริป หรือที่นั่ง'
    : 'ค้นหาชื่อผู้เช่า เบอร์ หรือทริป';

  if (tab === 'bookings') {
    updateBookingStats();
    renderBookings();
  } else if (equipLoaded) {
    updateEquipStats();
    renderEquipRentalsList();
  } else {
    loadEquipRentals();
  }
}

function onSearchInput() {
  if (currentAdminTab === 'bookings') {
    renderBookings();
  } else {
    renderEquipRentalsList();
  }
}

function refreshCurrentTab() {
  if (currentAdminTab === 'bookings') {
    loadBookings(false);
  } else {
    loadEquipRentals();
  }
}


function renderBookings() {
  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const statusFilter = currentStatusFilter;

  const filtered =
    allBookings.filter(function (item) {
      const searchable = [
        item.trip,
        item.name,
        item.nickname,
        item.phone,
        item.line,
        item.seat,
        item.date,
        item.bookingKey
      ]
        .join(" ")
        .toLowerCase();

      const matchSearch =
        !search ||
        searchable.includes(search);

      const matchStatus =
        !statusFilter ||
        item.status === statusFilter;

      return matchSearch && matchStatus;
    });

  const list =
    document.getElementById("bookingList");

  if (!filtered.length) {
    list.innerHTML =
      '<div class="empty"><span class="ico">📭</span>ไม่พบรายการที่ค้นหา</div>';

    return;
  }

  list.className = "";

  list.innerHTML =
    filtered
      .map(cardHtml)
      .join("");
}


function cardHtml(item) {
  const statusClass =
    getStatusClass(item.status);

  const tripImg = getTripImage(item.trip);

  const slipButton =
    item.slipUrl
      ? `
        <button
          class="slip-btn"
          onclick="openSlip('${encodeURIComponent(item.slipUrl)}')"
        >
          🧾 เปิดดูรูปสลิป
        </button>
      `
      : `
        <button
          class="slip-btn no-slip"
          disabled
        >
          ⚠️ ไม่มีรูปสลิป
        </button>
      `;

  return `
    <article class="card">
      <div class="card-photo">
        <img src="${escapeHtml(tripImg)}" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500&q=70'}">
        <span class="status ${statusClass}">${escapeHtml(item.status || "ไม่ระบุสถานะ")}</span>
        <div class="card-photo-title">${escapeHtml(item.trip || "-")}</div>
      </div>

      <div class="card-body">
        <div class="card-sub">📅 ${escapeHtml(item.date || "-")} &nbsp;·&nbsp; 🪑 เบาะ ${escapeHtml(item.seat || "-")}</div>

        <div class="info-grid">
          <div class="info">
            <span>ชื่อผู้จอง</span>
            <strong>${escapeHtml(item.name || "-")}</strong>
          </div>

          <div class="info">
            <span>ชื่อเล่น</span>
            <strong>${escapeHtml(item.nickname || "-")}</strong>
          </div>

          <div class="info">
            <span>เบอร์โทร</span>
            <strong>${escapeHtml(item.phone || "-")}</strong>
          </div>

          <div class="info">
            <span>LINE</span>
            <strong>${escapeHtml(item.line || "-")}</strong>
          </div>

          <div class="info">
            <span>เวลาจอง</span>
            <strong>${escapeHtml(item.timestamp || "-")}</strong>
          </div>

          <div class="info">
            <span>เวลาส่งสลิป</span>
            <strong>${escapeHtml(item.slipSubmittedAt || "-")}</strong>
          </div>

          <div class="info" style="grid-column:1 / -1">
            <span>🚏 จุดขึ้นรถ</span>
            <strong>${escapeHtml(findPickupText(item.bookingKey))}</strong>
          </div>
        </div>

        ${slipButton}

        <div class="action-row">
          <button
            class="action-btn approve-btn"
            onclick="confirmUpdate(
              '${escapeJs(item.bookingKey)}',
              'approve'
            )"
          >
            ✅ อนุมัติ
          </button>

          <button
            class="action-btn reject-btn"
            onclick="confirmUpdate(
              '${escapeJs(item.bookingKey)}',
              'reject'
            )"
          >
            ❌ ไม่ผ่าน
          </button>

          <button
            class="action-btn pending-btn"
            onclick="confirmUpdate(
              '${escapeJs(item.bookingKey)}',
              'pending'
            )"
          >
            ↩️ กลับเป็นรอตรวจ
          </button>
        </div>
      </div>
    </article>
  `;
}


function getStatusClass(status) {
  if (status === "ชำระเงินแล้ว") {
    return "status-approved";
  }

  if (status === "สลิปไม่ถูกต้อง") {
    return "status-rejected";
  }

  if (status === "รอตรวจสอบสลิป") {
    return "status-pending";
  }

  return "status-other";
}


/* ============================================================
   PICKUP POINTS (จุดขึ้นรถ) — ชีทแยกต่างหากจาก bookings เต็มรูปแบบ
   ดึงตรงจากชีท PickupPoints แล้ว "จับคู่ฝั่ง client" ด้วย bookingKey
   เท่านั้น ไม่ไปยุ่งกับโครงสร้างคอลัมน์ของ bookings เลย
============================================================ */

function loadPickupPoints() {
  if (!adminToken) return;

  const callbackName = "adminPickupCb_" + Date.now();
  const script = document.createElement("script");
  let finished = false;

  window[callbackName] = function (response) {
    finished = true;

    try {
      if (response && response.ok) {
        allPickupPoints = Array.isArray(response.pickups) ? response.pickups : [];
      } else {
        allPickupPoints = [];
      }

      // รีเฟรชการ์ดจองอีกครั้ง ให้ช่องจุดขึ้นรถอัปเดตด้วยข้อมูลที่เพิ่งโหลดมา
      if (currentAdminTab === 'bookings') {
        renderBookings();
      }

    } finally {
      cleanupJsonp(callbackName, script);
    }
  };

  script.onerror = function () {
    if (finished) return;
    allPickupPoints = [];
    cleanupJsonp(callbackName, script);
  };

  script.src =
    API_URL +
    "?action=adminPickupPoints" +
    "&adminToken=" +
    encodeURIComponent(adminToken) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();

  document.body.appendChild(script);
}

// จับคู่จุดขึ้นรถของรายการจองด้วย bookingKey (ฝั่ง client ล้วนๆ ไม่พึ่งพา backend merge)
function findPickupText(bookingKey) {
  if (!bookingKey) return "-";
  const match = allPickupPoints.find(p => p.bookingKey === bookingKey);
  return (match && match.pickup) ? match.pickup : "-";
}


/* ============================================================
   EQUIPMENT RENTALS (เช่าอุปกรณ์) — ชีทแยกจาก bookings
============================================================ */

function loadEquipRentals() {
  if (!adminToken) return;

  const list = document.getElementById("bookingList");
  list.innerHTML = '<div class="loading">⌛ กำลังโหลดรายการเช่าอุปกรณ์...</div>';

  const callbackName = "adminEquipCb_" + Date.now();
  const script = document.createElement("script");
  let finished = false;

  window[callbackName] = function (response) {
    finished = true;

    try {
      if (!response || !response.ok) {
        throw new Error(response?.message || "ไม่สามารถโหลดข้อมูลได้");
      }

      allEquipRentals = Array.isArray(response.rentals) ? response.rentals : [];
      equipLoaded = true;

      updateEquipStats();
      renderEquipRentalsList();

    } catch (error) {
      Swal.fire({
        icon: "error",
        title: "โหลดข้อมูลเช่าอุปกรณ์ไม่สำเร็จ",
        text: error.message,
        background: "#0c1524",
        color: "#f1f5f9",
        confirmButtonColor: "#0284c7"
      });

      list.innerHTML = '<div class="empty"><span class="ico">📭</span>ไม่สามารถโหลดข้อมูลได้</div>';

    } finally {
      cleanupJsonp(callbackName, script);
    }
  };

  script.onerror = function () {
    if (finished) return;

    Swal.fire({
      icon: "error",
      title: "เชื่อมต่อหลังบ้านไม่ได้",
      text: "ตรวจสอบ URL และการ Deploy Apps Script",
      background: "#0c1524",
      color: "#f1f5f9",
      confirmButtonColor: "#0284c7"
    });

    cleanupJsonp(callbackName, script);
  };

  script.src =
    API_URL +
    "?action=adminEquipRentals" +
    "&adminToken=" +
    encodeURIComponent(adminToken) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();

  document.body.appendChild(script);
}


function renderEquipRentalsList() {
  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const filtered = allEquipRentals.filter(function (item) {
    const searchable = [
      item.trip,
      item.name,
      item.nickname,
      item.phone,
      item.seat,
      item.itemsSummary,
      item.rentId
    ]
      .join(" ")
      .toLowerCase();

    return !search || searchable.includes(search);
  });

  const list = document.getElementById("bookingList");

  if (!filtered.length) {
    list.innerHTML = '<div class="empty"><span class="ico">🎒</span>ยังไม่มีรายการเช่าอุปกรณ์</div>';
    return;
  }

  list.className = "";
  list.innerHTML = filtered.map(equipCardHtml).join("");
}


function equipItemsHtml(item) {
  const rows = [];
  if (Number(item.tent) > 0) rows.push(`<span>⛺ เต็นท์ x${escapeHtml(item.tent)}</span>`);
  if (Number(item.sleepingBag) > 0) rows.push(`<span>🛏️ ถุงนอน x${escapeHtml(item.sleepingBag)}</span>`);
  if (Number(item.sleepingPad) > 0) rows.push(`<span>🧻 แผ่นรองนอน x${escapeHtml(item.sleepingPad)}</span>`);
  return rows.join('');
}


function equipCardHtml(item) {
  const tripImg = getTripImage(item.trip);
  const totalText = '฿' + Number(item.total || 0).toLocaleString();

  return `
    <article class="card">
      <div class="card-photo">
        <img src="${escapeHtml(tripImg)}" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500&q=70'}">
        <span class="status price-pill">${totalText}</span>
        <div class="card-photo-title">${escapeHtml(item.trip || "-")}</div>
      </div>

      <div class="card-body">
        <div class="card-sub">📅 ${escapeHtml(item.date || "-")} &nbsp;·&nbsp; 🪑 เบาะ ${escapeHtml(item.seat || "-")}</div>

        <div class="info-grid">
          <div class="info">
            <span>ผู้เช่า</span>
            <strong>${escapeHtml(item.name || "-")}</strong>
          </div>

          <div class="info">
            <span>ชื่อเล่น</span>
            <strong>${escapeHtml(item.nickname || "-")}</strong>
          </div>

          <div class="info">
            <span>เบอร์โทร</span>
            <strong>${escapeHtml(item.phone || "-")}</strong>
          </div>

          <div class="info">
            <span>เวลาเช่า</span>
            <strong>${escapeHtml(item.timestamp || "-")}</strong>
          </div>
        </div>

        <div class="equip-items">${equipItemsHtml(item)}</div>

        <div class="equip-total-row"><span>ยอดรวม</span><span>${totalText}</span></div>
      </div>
    </article>
  `;
}


/* ============================================================
   OPEN SLIP
============================================================ */

function openSlip(encodedUrl) {
  const url =
    decodeURIComponent(encodedUrl);

  /*
   * กันไว้เผื่อข้อมูลคอลัมน์เพี้ยน (เช่น แถวเก่าก่อน migrate)
   * แล้วค่าที่ได้ไม่ใช่ URL จริงๆ — จะเจอ Swal แจ้งเตือนแทนหน้า 404
   */
  if (!/^https?:\/\//i.test(url)) {
    Swal.fire({
      icon: "warning",
      title: "ลิงก์สลิปไม่ถูกต้อง",
      text: "รายการนี้อาจเป็นข้อมูลเก่าที่ยังไม่ได้ย้ายคอลัมน์ (ลอง Run migrateBookingColumns ใน Apps Script ก่อน)",
      background: "#0c1524",
      color: "#f1f5f9",
      confirmButtonColor: "#0284c7"
    });
    return;
  }

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* ============================================================
   UPDATE STATUS
============================================================ */

function confirmUpdate(
  bookingKey,
  adminAction
) {
  if (!bookingKey) {
    Swal.fire({
      icon: "error",
      title: "รายการนี้ไม่มี Booking Key",
      text: "เป็นข้อมูลเก่าที่ยังไม่มีรหัสรายการจอง",
      background: "#0c1524",
      color: "#f1f5f9"
    });

    return;
  }

  const config = {
    approve: {
      title: "อนุมัติสลิปนี้?",
      text: "สถานะจะเปลี่ยนเป็น ชำระเงินแล้ว",
      icon: "question",
      confirm: "✅ อนุมัติ",
      color: "#10b981"
    },

    reject: {
      title: "ระบุว่าสลิปไม่ผ่าน?",
      text: "สถานะจะเปลี่ยนเป็น สลิปไม่ถูกต้อง",
      icon: "warning",
      confirm: "❌ ไม่ผ่าน",
      color: "#ef4444"
    },

    pending: {
      title: "กลับเป็นรอตรวจ?",
      text: "สถานะจะกลับเป็น รอตรวจสอบสลิป",
      icon: "question",
      confirm: "↩️ ยืนยัน",
      color: "#64748b"
    }
  }[adminAction];

  Swal.fire({
    title: config.title,
    text: config.text,
    icon: config.icon,
    showCancelButton: true,
    confirmButtonText: config.confirm,
    cancelButtonText: "ยกเลิก",
    confirmButtonColor: config.color,
    cancelButtonColor: "#475569",
    background: "#0c1524",
    color: "#f1f5f9"
  }).then(function (result) {
    if (result.isConfirmed) {
      updateStatus(
        bookingKey,
        adminAction
      );
    }
  });
}


function updateStatus(
  bookingKey,
  adminAction
) {
  Swal.fire({
    title: "กำลังอัปเดต...",
    text: "กรุณารอสักครู่",
    allowOutsideClick: false,
    showConfirmButton: false,
    background: "#0c1524",
    color: "#f1f5f9",
    didOpen: function () {
      Swal.showLoading();
    }
  });

  const form =
    document.createElement("form");

  form.method = "POST";
  form.action = API_URL;
  form.target = "adminPostFrame";
  form.style.display = "none";

  const fields = {
    action: "adminUpdate",
    adminToken: adminToken,
    bookingKey: bookingKey,
    adminAction: adminAction
  };

  Object.entries(fields)
    .forEach(function ([name, value]) {
      const input =
        document.createElement("input");

      input.type = "hidden";
      input.name = name;
      input.value = value;

      form.appendChild(input);
    });

  document.body.appendChild(form);
  form.submit();

  /*
   * Apps Script อยู่คนละโดเมน
   * รอหลังบ้านอัปเดตแล้วโหลดรายการใหม่
   */
  setTimeout(function () {
    form.remove();

    Swal.fire({
      icon: "success",
      title: "อัปเดตสถานะแล้ว",
      timer: 1000,
      showConfirmButton: false,
      background: "#0c1524",
      color: "#f1f5f9"
    });

    setTimeout(function () {
      loadBookings(false);
    }, 600);

  }, 1600);
}


/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeJs(value) {
  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}
